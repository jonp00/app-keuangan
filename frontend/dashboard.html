<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catatan Keuangan - Dashboard</title>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-xs">
      <div class="max-w-2xl mx-auto flex justify-between items-center">
        <div>
          <h1 class="font-bold text-lg text-slate-900">Catatan Keuangan</h1>
          <p id="nama-user" class="text-xs text-slate-500"></p>
        </div>
        <button
          id="btn-logout"
          class="text-xs border border-slate-300 hover:bg-slate-100 px-3 py-1.5 rounded-xl transition cursor-pointer"
        >
          Keluar
        </button>
      </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
      <!-- Ringkasan Saldo -->
      <div class="grid grid-cols-3 gap-3">
        <div
          class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 text-center"
        >
          <p class="text-xs text-slate-500 font-medium mb-1">Pemasukan</p>
          <p
            id="total-masuk"
            class="text-sm md:text-base font-bold text-emerald-600"
          >
            Rp 0
          </p>
        </div>
        <div
          class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 text-center"
        >
          <p class="text-xs text-slate-500 font-medium mb-1">Pengeluaran</p>
          <p
            id="total-keluar"
            class="text-sm md:text-base font-bold text-red-600"
          >
            Rp 0
          </p>
        </div>
        <div
          class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 text-center"
        >
          <p class="text-xs text-slate-500 font-medium mb-1">Saldo</p>
          <p id="saldo" class="text-sm md:text-base font-bold text-slate-900">
            Rp 0
          </p>
        </div>
      </div>

      <!-- Form Tambah Transaksi -->
      <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-sm font-bold text-slate-900 mb-4">
          Tambah Transaksi Baru
        </h2>
        <form id="form-transaksi" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >TIPE</label
              >
              <select
                id="input-tipe"
                required
                class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
              >
                <option value="masuk">Pemasukan (+)</option>
                <option value="keluar">Pengeluaran (-)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >JUMLAH (RP)</label
              >
              <input
                type="number"
                id="input-jumlah"
                required
                min="1"
                placeholder="0"
                class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >KATEGORI</label
            >
            <input
              type="text"
              id="input-kategori"
              placeholder="misal: Gaji, Makan, Transport"
              class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >KETERANGAN</label
            >
            <input
              type="text"
              id="input-keterangan"
              placeholder="opsional"
              class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl text-xs transition cursor-pointer"
          >
            Simpan Transaksi
          </button>
        </form>
      </div>

      <!-- Daftar Transaksi -->
      <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-sm font-bold text-slate-900 mb-3">Riwayat Transaksi</h2>
        <div id="daftar-transaksi" class="space-y-2">
          <div class="text-center text-xs text-slate-400 py-6">
            Memuat data...
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
