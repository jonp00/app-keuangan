<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catatan Keuangan - Login</title>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800"
  >
    <div
      class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-sm"
    >
      <h1 id="judul" class="text-xl font-bold text-slate-900">Masuk</h1>
      <p id="subjudul" class="text-xs text-slate-500 mb-6">
        Akses catatan keuangan kamu
      </p>

      <div id="pesan" class="hidden p-3 rounded-xl text-xs mb-4"></div>

      <!-- Form Single (Tanpa Action) -->
      <form id="form-auth" class="space-y-4">
        <div id="group-nama" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1"
            >NAMA LENGKAP</label
          >
          <input
            type="text"
            id="input-nama"
            class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1"
            >USERNAME</label
          >
          <input
            type="text"
            id="input-username"
            required
            class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1"
            >PASSWORD</label
          >
          <input
            type="password"
            id="input-password"
            required
            class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
          />
        </div>

        <button
          type="submit"
          id="btn-submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl text-xs transition cursor-pointer"
        >
          Masuk
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500">
        <span id="text-toggle">Belum punya akun?</span>
        <button
          id="btn-toggle"
          class="text-slate-900 font-semibold underline ml-1 cursor-pointer"
        >
          Daftar di sini
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
