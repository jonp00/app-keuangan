<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catatan Keuangan - Hutang</title>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <!-- Header Navigasi -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-xs">
      <div class="max-w-2xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-4">
          <a
            href="/dashboard.html"
            class="text-xs font-semibold text-slate-500 hover:text-slate-900 transition"
          >
            ← Dashboard
          </a>
          <h1 class="font-bold text-lg text-slate-900">Catatan Hutang</h1>
        </div>
        <button
          id="btn-logout"
          class="text-xs border border-slate-300 hover:bg-slate-100 px-3 py-1.5 rounded-xl transition cursor-pointer"
        >
          Keluar
        </button>
      </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
      <!-- Form Tambah Hutang -->
      <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-sm font-bold text-slate-900 mb-4">Catat Hutang Baru</h2>
        <form id="form-hutang" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >PEMBERI HUTANG</label
              >
              <input
                type="text"
                id="input-pemberi"
                required
                placeholder="misal: Budi / Bank BCA"
                class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >JUMLAH HUTANG (RP)</label
              >
              <input
                type="number"
                id="input-jumlah"
                required
                min="1"
                placeholder="0"
                class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >JATUH TEMPO (OPSIONAL)</label
            >
            <input
              type="date"
              id="input-jatuh-tempo"
              class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >KETERANGAN</label
            >
            <input
              type="text"
              id="input-keterangan"
              placeholder="opsional"
              class="w-full border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-slate-800 transition"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl text-xs transition cursor-pointer"
          >
            Simpan Catatan Hutang
          </button>
        </form>
      </div>

      <!-- Daftar Hutang -->
      <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-sm font-bold text-slate-900 mb-3">Daftar Hutang</h2>
        <div id="daftar-hutang" class="space-y-3">
          <div class="text-center text-xs text-slate-400 py-6">
            Memuat data...
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/hutang.js"></script>
  </body>
</html>
